packages:
  - "apps/*"
  - "packages/*"

# Keep the content-addressable store inside the repository instead of the
# user's home directory, so installs work in sandboxed/CI environments.
storeDir: .pnpm-store

# Dependency build scripts are blocked by default (pnpm 11+). Every entry below
# is an explicit decision about a package that requests a lifecycle script.
allowBuilds:
  # Native module resolver used by eslint-config-next; its install script
  # fetches the platform-specific binding.
  unrs-resolver: true
  # sharp is optional: Next.js only needs it for optimized production images.
  # Nothing renders next/image yet, so its build stays blocked.
  sharp: false
  # core-js (pulled in by posthog-js) only prints a funding notice from its
  # postinstall. Nothing is compiled, so it stays blocked like sharp.
  core-js: false
  # esbuild backs `tsx` (the API's dev runner) and `drizzle-kit` (migrations).
  # Its install script selects the platform-specific binary; without it neither
  # tool can start.
  esbuild: true
  '@sentry/node-cpu-profiler': true

overrides:
  "next@16.3.5": "16.3.8"
  "next@16.3.6": "16.3.8"
  "brace-expansion@5.0.9": "5.0.12"
  "source-map-js@1.2.1": "1.2.2"
  "sharp@0.35.4": "0.35.5"
  "vite@8.3.0": "8.3.3"

  "hono@4.13.8": "4.13.11"
  "esbuild@0.18.20": "0.25.12"
